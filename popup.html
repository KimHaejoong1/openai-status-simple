<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="images/status.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>OpenAI Status</title>
  </head>
  <body>
    <main class="app">
      <section id="overview" class="overview" data-tone="unknown" aria-live="polite" aria-atomic="true" aria-busy="true">
        <div class="overview-top">
          <div class="eyebrow"><span class="status-dot"></span><span id="overview-label">확인 중</span></div>
          <button id="refresh" class="icon-button" type="button" aria-label="상태 새로고침" title="상태 새로고침">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5"/></svg>
          </button>
        </div>
        <h1 id="overview-title">현재 상태를 확인하고 있어요</h1>
        <p id="overview-description">OpenAI의 최신 상태를 불러오는 중입니다.</p>
        <div class="overview-bottom"><span id="service-count">잠시만 기다려 주세요</span><span class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
      </section>
      <div class="section-heading"><h2>서비스 상태</h2><span>현재 기준</span></div>
      <div id="services" class="services" aria-busy="true"><div class="placeholder">서비스별 상태를 불러오고 있어요.</div></div>
      <p id="data-notice" class="data-notice" hidden></p>
      <section id="incidents-section" class="incidents-section" aria-labelledby="incidents-heading">
        <div class="section-heading"><h2 id="incidents-heading">최근 업데이트</h2><a href="https://status.openai.com/history" target="_blank" rel="noopener noreferrer">전체 기록 <span aria-hidden="true">↗</span></a></div>
        <div id="incidents"><p class="muted">업데이트를 확인하고 있어요.</p></div>
      </section>
      <footer>
        <div class="sync-line"><span id="sync-state" class="sync-state" role="status">연결 중</span><span>열려 있는 동안 60초마다 갱신</span></div>
        <a class="source-link" href="https://status.openai.com" target="_blank" rel="noopener noreferrer">OpenAI 공식 상태 페이지 <span aria-hidden="true">↗</span></a>
        <p class="footnote">공식 상태 데이터를 간단히 보여주는 비공식 도구입니다.</p>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
